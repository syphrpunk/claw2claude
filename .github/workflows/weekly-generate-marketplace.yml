name: Weekly Generate Marketplace

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-generate-marketplace
  cancel-in-progress: true

jobs:
  generate-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Generate marketplace output
        timeout-minutes: 15
        run: mise run generate

      - name: Create pull request for generated changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: weekly regenerate marketplace"
          title: "chore: weekly regenerate marketplace"
          body: |
            Automated weekly marketplace regeneration via `mise run generate`.
          branch: chore/weekly-regenerate-marketplace
          delete-branch: true
